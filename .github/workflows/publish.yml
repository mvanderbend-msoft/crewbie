name: Publish package artifacts
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json')"
      - name: Upload npm-installable package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE=$(npm pack --ignore-scripts --silent)
          sha256sum "$PACKAGE" > SHA256SUMS
          gh release upload "$RELEASE_TAG" "$PACKAGE" SHA256SUMS --repo "$GITHUB_REPOSITORY"
  publish:
    if: ${{ vars.CREWBIE_NPM_PUBLISH_ENABLED == 'true' }}
    needs: artifacts
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json')"
      - name: Publish with trusted publishing
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --access public --provenance --tag "$TAG"
