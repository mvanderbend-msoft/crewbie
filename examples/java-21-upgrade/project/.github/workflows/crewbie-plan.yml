name: Crewbie planning
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Open planning PR to revise
        required: true
        type: string
      feedback:
        description: Specific changes requested (one paid revision, reusing context)
        required: true
        type: string
      head:
        description: Expected PR head (set by crewbie revise-plan)
        required: false
        type: string
      source:
        description: Current source fingerprint (set by crewbie revise-plan)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crewbie-planning-${{ github.event.issue.number || inputs.pr || github.run_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ (github.event_name == 'issues' && github.event.label.name == 'crewbie:ready-for-planning') || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      model: ${{ steps.context.outputs.model }}
      input_artifact: crewbie-planning-input-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install approved Crewbie package
        env:
          CREWBIE_PACKAGE: ${{ vars.CREWBIE_PACKAGE || 'https://github.com/mvanderbend-msoft/crewbie/releases/download/v0.1.0-alpha.72/crewbie-cli-0.1.0-alpha.72.tgz' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/crewbie" --ignore-scripts --no-audit --no-fund "$CREWBIE_PACKAGE"
      - name: Verify ready label and prepare coordinator context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/crewbie/node_modules/@crewbie/cli/dist/cli.js" internal-plan --prepare
      - name: Check execution credential before paid planning
        if: ${{ steps.context.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CREWBIE_USER_TOKEN }}
        run: node "$RUNNER_TEMP/crewbie/node_modules/@crewbie/cli/dist/cli.js" internal-execution-preflight
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ steps.context.outputs.ready == 'true' }}
        with:
          name: crewbie-planning-input-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 1
          path: |
            .crewbie-planning-input.json
            .crewbie-planning-prompt.txt
          if-no-files-found: error
  analyze:
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      copilot-requests: write
    outputs:
      output_artifact: crewbie-planning-output-${{ github.run_attempt }}
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install approved Crewbie package
        env:
          CREWBIE_PACKAGE: ${{ vars.CREWBIE_PACKAGE || 'https://github.com/mvanderbend-msoft/crewbie/releases/download/v0.1.0-alpha.72/crewbie-cli-0.1.0-alpha.72.tgz' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/crewbie" --ignore-scripts --no-audit --no-fund "$CREWBIE_PACKAGE"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.input_artifact }}
      - name: Generate and validate coordinator plan with bounded format correction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CREWBIE_PLANNING_MODEL: ${{ needs.prepare.outputs.model }}
          CREWBIE_COPILOT_VERSION: ${{ vars.CREWBIE_COPILOT_VERSION }}
        run: |
          [[ "$CREWBIE_COPILOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Set an approved exact Copilot CLI version."; exit 1; }
          test -n "$CREWBIE_PLANNING_MODEL" || { echo "Approve an explicit planning model."; exit 1; }
          npm install --prefix "$RUNNER_TEMP/copilot" --no-audit --no-fund "@github/copilot@$CREWBIE_COPILOT_VERSION"
          export CREWBIE_COPILOT_BIN="$RUNNER_TEMP/copilot/node_modules/.bin/copilot"
          node "$RUNNER_TEMP/crewbie/node_modules/@crewbie/cli/dist/cli.js" internal-plan --analyze
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: crewbie-planning-output-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 1
          path: |
            .crewbie-planning-output.txt
            .crewbie-planning-validation.json
            .crewbie-planning-attempt-*.txt
          if-no-files-found: error
  publish:
    needs: [prepare, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install approved Crewbie package
        env:
          CREWBIE_PACKAGE: ${{ vars.CREWBIE_PACKAGE || 'https://github.com/mvanderbend-msoft/crewbie/releases/download/v0.1.0-alpha.72/crewbie-cli-0.1.0-alpha.72.tgz' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/crewbie" --ignore-scripts --no-audit --no-fund "$CREWBIE_PACKAGE"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.prepare.outputs.input_artifact }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.analyze.outputs.output_artifact }}
      - name: Validate and publish planning PR only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/crewbie/node_modules/@crewbie/cli/dist/cli.js" internal-plan --apply
